# Nginx site config for Fixify. Copy to /etc/nginx/sites-available/fixify
# on the VPS, symlink into sites-enabled, then run certbot (see DEPLOY.md)
# to add the HTTPS server block automatically.
#
# Replace YOUR_DOMAIN below before enabling this.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
